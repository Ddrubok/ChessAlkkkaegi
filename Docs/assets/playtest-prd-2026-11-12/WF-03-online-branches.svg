<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768" role="img" aria-labelledby="title desc"><title id="title">WF-03 온라인 진입 경로의 정보 구조</title><desc id="desc">SC-ONLINE · PF-R08 · 계정 상태에 따른 두 분기 추론 와이어프레임. 좌표와 크기는 제안값이며 실제 게임 캡처가 아닙니다.</desc><rect width="1366" height="768" fill="#171410"/><g font-family="Segoe UI, Malgun Gothic, sans-serif"><text x="32" y="38" font-size="23" fill="#ffdc86" font-weight="700">WF-03 · 온라인 진입 경로의 정보 구조</text><text x="32" y="68" font-size="16" fill="#bdb5a7" font-weight="400">SC-ONLINE · PF-R08 · 계정 상태에 따른 두 분기 · 추론 와이어프레임 / 게임 연결 없음 / 치수 추정</text><line x1="32" x2="1334" y1="87" y2="87" stroke="#5d5341"/><text x="58" y="137" font-size="21" fill="#bdb5a7" font-weight="400">두 화면을 동시에 띄우는 레이아웃이 아니라 상태별 분기를 나란히 나타낸 구조안</text><rect x="58" y="174" width="598" height="516" fill="#28241e" stroke="#8e7946" rx="9"/><text x="86" y="215" font-size="26" fill="#ffdc86" font-weight="700">게스트 / 친구와 대전</text><text x="86" y="252" font-size="21" fill="#f8f2e7" font-weight="400">친구에게 코드를 공유하거나 받은 코드를 입력</text><text x="86" y="285" font-size="19" fill="#bdb5a7" font-weight="400">무작위 상대 검색은 게임 내 계정 연결 후 이용</text><rect x="87" y="322" width="540" height="44" fill="#ffdb54" stroke="#ffdb54" rx="7"/><text x="102" y="351" font-size="19" fill="#171410" font-weight="600">방 만들기</text><text x="87" y="411" font-size="20" fill="#f8f2e7" font-weight="400">방 코드</text><rect x="87" y="430" width="540" height="48" fill="#f8f2e7" stroke="#7b766d" rx="4"/><text x="104" y="461" font-size="21" fill="#6f6a62" font-weight="400">XXXX-XXXX-XXXX</text><rect x="87" y="498" width="540" height="44" fill="#ffdb54" stroke="#ffdb54" rx="7"/><text x="102" y="527" font-size="19" fill="#171410" font-weight="600">코드로 참여</text><text x="87" y="589" font-size="20" fill="#bdb5a7" font-weight="400">실패: 이유 + 다시 시도 / 돌아가기</text><rect x="87" y="616" width="540" height="44" fill="#28241e" stroke="#7b766d" rx="7"/><text x="102" y="645" font-size="19" fill="#f8f2e7" font-weight="600">취소</text><rect x="710" y="174" width="598" height="516" fill="#28241e" stroke="#8e7946" rx="9"/><text x="738" y="215" font-size="26" fill="#ffdc86" font-weight="700">게임 계정 연결됨 / 상대 찾기</text><text x="738" y="252" font-size="21" fill="#f8f2e7" font-weight="400">클래식과 전략은 서로 다른 대기열</text><rect x="738" y="283" width="260" height="44" fill="#ffdb54" stroke="#ffdb54" rx="7"/><text x="753" y="312" font-size="19" fill="#171410" font-weight="600">클래식 선택</text><rect x="1010" y="283" width="269" height="44" fill="#28241e" stroke="#7b766d" rx="7"/><text x="1025" y="312" font-size="19" fill="#f8f2e7" font-weight="600">전략 선택</text><rect x="738" y="362" width="540" height="140" fill="#211d18" stroke="#5d5341" rx="9"/><text x="760" y="401" font-size="20" fill="#ffdc86" font-weight="600">예시 상태: 같은 모드의 상대를 기다리는 중</text><text x="760" y="439" font-size="21" fill="#f8f2e7" font-weight="400">다른 대기자: 0명</text><text x="760" y="476" font-size="18" fill="#bdb5a7" font-weight="400">실제 큐 상태만 표시 · 예시 데이터</text><rect x="738" y="531" width="540" height="44" fill="#28241e" stroke="#7b766d" rx="7"/><text x="753" y="560" font-size="19" fill="#f8f2e7" font-weight="600">검색 취소</text><text x="738" y="614" font-size="21" fill="#bdb5a7" font-weight="400">대안: 친구 방 코드로 초대</text><text x="738" y="649" font-size="20" fill="#bdb5a7" font-weight="400">연결 오류는 대기자 없음과 구분</text></g></svg>