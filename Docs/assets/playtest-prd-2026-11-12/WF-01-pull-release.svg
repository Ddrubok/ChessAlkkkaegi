 M675 342 L683 329 L691 342" fill="none" stroke="#ffdc86" stroke-width="5"/><path d="M683 498 L683 588 M675 576 L683 590 L691 576" fill="none" stroke="#f8f2e7" stroke-width="3" stroke-dasharray="7 6"/><circle cx="683" cy="599" r="12" fill="#eee8dc" stroke="#8e7946" stroke-width="2"/><text x="710" y="554" font-size="19" fill="#f8f2e7" font-weight="400">당기는 만큼 힘 조절</text><text x="710" y="585" font-size="21" fill="#ffdc86" font-weight="700">손을 놓으면 발사</text><text x="40" y="226" font-size="23" fill="#ffdc86" font-weight="700">구도·여백 우선 조정</text><text x="40" y="263" font-size="18" fill="#bdb5a7" font-weight="400">보드 밖에도 당길 공간 확보</text><text x="40" y="295" font-size="18" fill="#bdb5a7" font-weight="400">말 식별·오선택을 함께 검증</text><text x="40" y="359" font-size="22" fill="#ffdc86" font-weight="700">같은 화면 · 같은 설정</text><text x="40" y="394" font-size="18" fill="#bdb5a7" font-weight="400">말 위치·방향과 무관한 감도</text><text x="40" y="426" font-size="18" fill="#bdb5a7" font-weight="400">당김 중 카메라·거리 고정</text><text x="1054" y="226" font-size="22" fill="#ffdc86" font-weight="700">공간이 부족하면</text><text x="1054" y="263" font-size="17" fill="#bdb5a7" font-weight="400">화면별 실제 당김 거리 조정</text><text x="1054" y="295" font-size="17" fill="#bdb5a7" font-weight="400">설정에 적용값·제약 표시</text><text x="1054" y="359" font-size="22" fill="#ffdc86" font-weight="700">기존 조작을 유지</text><text x="1054" y="394" font-size="17" fill="#bdb5a7" font-weight="400">별도 슬라이더·발사 버튼 없음</text><text x="1054" y="426" font-size="18" fill="#bdb5a7" font-weight="400">화면 밖 놓기는 취소</text><rect x="40" y="615" width="246" height="65" fill="#211d18" stroke="#5d5341" rx="9"/><text x="58" y="644" font-size="21" fill="#ffdc86" font-weight="700">50% · 읽기용 표시</text><text x="58" y="668" font-size="16" fill="#bdb5a7" font-weight="400">직접 조절하는 UI 아님</text><rect x="394" y="682" width="578" height="46" fill="#211815" stroke="#b74949" rx="9"/><text x="468" y="711" font-size="20" fill="#f2b3ac" font-weight="600">기존 취소 영역 · ESC / 우클릭</text><text x="40" y="75